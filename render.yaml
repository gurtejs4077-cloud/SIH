services:
  - type: web
    name: airfare-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && playwright install chromium --with-deps"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATA_PROVIDER
        value: scraper
      - key: COLLECTION_INTERVAL_MINUTES
        value: "30"
      - key: DATABASE_URL
        value: sqlite:///./airfare_intelligence.db
